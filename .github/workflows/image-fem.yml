name: image-fem
# Builds phyein-fem (DOLFINx + Gmsh + CalculiX + Elmer + ParaView + ffmpeg), runs its self-test (einzel lens, beam modes, heat, a headless film),
# and only then pushes ghcr.io/<owner>/phyein-fem:{latest,<commit>}.  Nothing here costs money: public repo, standard runner.
on:
  push:
    branches: [main]
    paths: ["images/fem/**", "tools/**", "cases/fem/**", ".github/workflows/image-fem.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # push with the built-in GITHUB_TOKEN; no personal token

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          IMG=ghcr.io/$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')/phyein-fem
          echo "IMG=$IMG" >> "$GITHUB_ENV"
          # the source label links the GHCR package to this repository, which lets GITHUB_TOKEN push to it.
          # --provenance=false: without it the runner builds an image index with an attestation manifest that carries no label,
          # and the registry refused the first push of a NEW package with "denied" (seen 11 Nov 2026)
          docker build --provenance=false -f images/fem/Dockerfile \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            -t "$IMG:${{ github.sha }}" -t "$IMG:latest" .
      - name: Self-test inside the image
        run: docker run --rm "$IMG:${{ github.sha }}"
      - name: Push
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMG:${{ github.sha }}"
          docker push "$IMG:latest"
